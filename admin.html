<style>
:root{
  --ink:#16231c; --green-900:#123524; --green-700:#1f6b45; --green-600:#2c8a58; --green-500:#37a06a;
  --cream:#faf7ef; --paper:#ffffff; --line:#e7e2d4; --mango:#e2932a; --tomato:#c9532f; --muted:#767c72;
  --radius:14px; --shadow:0 8px 24px -14px rgba(18,53,36,.28); --sidebar-w:230px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:'Sora',system-ui,sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
table{border-collapse:collapse;width:100%;}

/* Layout */
#adminApp{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);background:linear-gradient(180deg,var(--green-900),#0d2519);color:#fff;
  position:fixed;top:0;left:0;bottom:0;padding:22px 14px;display:flex;flex-direction:column;z-index:30;
}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;}
.sidebar .brand .logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:18px;}
.sidebar .brand b{font-family:'Sora';font-size:16px;}
.sidebar .brand small{display:block;font-size:10px;color:rgba(255,255,255,.6);}
.navlink{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;font-size:13px;font-weight:600;color:rgba(255,255,255,.75);margin-bottom:2px;}
.navlink .ic{font-size:16px;width:20px;text-align:center;}
.navlink.active{background:rgba(255,255,255,.12);color:#fff;}
.navlink:hover{background:rgba(255,255,255,.08);}
.sidebar .bottom{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);}
.admin-chip{display:flex;align-items:center;gap:10px;padding:8px;font-size:12px;}
.admin-chip .av{width:30px;height:30px;border-radius:50%;background:var(--green-600);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.logoutbtn{width:100%;background:rgba(255,255,255,.1);border:none;color:#fff;padding:9px;border-radius:9px;font-size:12px;font-weight:600;margin-top:8px;}

.main{margin-left:var(--sidebar-w);flex:1;padding:26px 30px 60px;max-width:1280px;}
@media(max-width:860px){
  .sidebar{transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:none;}
  .main{margin-left:0;padding:18px;}
  .menutoggle{display:inline-flex !important;}
}
.menutoggle{display:none;background:#fff;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;align-items:center;justify-content:center;font-size:16px;margin-bottom:14px;}

.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.pagehead h1{font-size:21px;margin:0;}
.pagehead p{margin:2px 0 0;color:var(--muted);font-size:13px;}

.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:10px;border:none;font-weight:700;font-size:13px;}
.btn-primary{background:var(--green-700);color:#fff;}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
.btn-danger{background:#fdecea;color:var(--tomato);}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;}
.stat .val{font-size:22px;font-weight:800;margin-top:8px;font-family:'Sora';}
.stat .sub{font-size:11px;color:var(--muted);margin-top:4px;}
.stat.warn .val{color:var(--tomato);}

.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:20px;}
.panel h3{margin:0 0 14px;font-size:15px;}
.chart-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
@media(max-width:860px){.chart-grid{grid-template-columns:1fr;}}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.toolbar input,.toolbar select{padding:9px 12px;border-radius:9px;border:1.5px solid var(--line);font-size:13px;}
.toolbar input{flex:1;min-width:180px;}

table.datatable{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.datatable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:var(--cream);padding:11px 14px;}
.datatable td{padding:12px 14px;font-size:13px;border-top:1px solid var(--line);vertical-align:middle;}
.datatable tr:hover td{background:#fbfbf8;}
.imgthumb{width:38px;height:38px;border-radius:9px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:17px;overflow:hidden;}
.imgthumb img{width:100%;height:100%;object-fit:cover;}
.rowactions{display:flex;gap:6px;}

.chip{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.chip.PLACED{background:#fff3d6;color:#946200;} .chip.CONFIRMED{background:#dbeeff;color:#1c5fa6;}
.chip.PREPARING{background:#fde3c7;color:#a35a0b;} .chip.READY{background:#e4dbff;color:#5b34c9;}
.chip.OUT_FOR_DELIVERY{background:#d6f0ff;color:#0b6ea3;} .chip.DELIVERED{background:#dcf5e4;color:#1a7d43;}
.chip.CANCELLED{background:#fbdcdc;color:#a12525;} .chip.PAID{background:#dcf5e4;color:#1a7d43;}
.chip.PENDING{background:#fff3d6;color:#946200;} .chip.FAILED{background:#fbdcdc;color:#a12525;}
.chip.REFUNDED{background:#e4e4e4;color:#555;} .chip.active-yes{background:#dcf5e4;color:#1a7d43;} .chip.active-no{background:#f1f1f1;color:#888;}
.chip.low{background:#fde3c7;color:#a35a0b;} .chip.out{background:#fbdcdc;color:#a12525;}

.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,15,.5);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;}
.modal-card{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:24px;}

.field{margin-bottom:13px;}

.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.checkrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 0;}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--green-900),var(--green-700));}

.login-card h2{text-align:center;margin:8px 0 2px;}
.login-card p{text-align:center;color:var(--muted);font-size:12px;margin:0 0 22px;}

.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;z-index:100;box-shadow:var(--shadow);}

@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);}
.tabbtn{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;background:none;border-left:none;border-right:none;border-top:none;}
.tabbtn.active{color:var(--green-700);border-bottom-color:var(--green-700);}
.qr-preview{width:90px;height:90px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.qr-preview img{width:100%;height:100%;object-fit:cover;}
</style>

<body>
<div id="app"></div>

<script>
/* =========================================================
   FIREBASE CONFIG — same project as the customer app.
   Replace with your project's config, or set
   window.__FIREBASE_CONFIG__ before this file loads.
========================================================= */
const firebaseConfig = window.__FIREBASE_CONFIG__ || {
  apiKey: "AIzaSyBp8_imLgD5QSHpvBTdMB71LW_T4zK62_E",
  authDomain: "freshcart-c68d3.firebaseapp.com",
  projectId: "freshcart-c68d3",
  storageBucket: "freshcart-c68d3.firebasestorage.app",
  messagingSenderId: "75372139912",
  appId: "1:75372139912:web:1da4e482f12a00eddbd63d"
};
let fbReady = false;
try{ firebase.initializeApp(firebaseConfig); fbReady = firebaseConfig.apiKey !== "YOUR_API_KEY"; }catch(e){ console.error(e); }
const auth = fbReady ? firebase.auth() : null;
const db = fbReady ? firebase.firestore() : null;
// No Firebase Storage in this build: every image (product, category,
// store logo, promo banner, payment QR code) is picked from disk,
// downscaled + compressed in the browser with a <canvas>, and saved
// as a base64 data-URL string directly on the Firestore document.
// That keeps things to two plain HTML files with zero extra backend
// setup, at the cost of Firestore's ~1MiB per-document limit — the
// compression below targets well under that per image.

/* NOTE on admin authorization (read before deploying):
   The login screen you see asks for a plain username + password
   (not an email) — that's what this section implements. Firebase
   itself only understands email/password accounts, and Firestore
   security rules only understand a signed-in request.auth.uid, so
   under the hood this file:
     1. Checks the username/password you type against a hash stored
        in Firestore (adminCredentials/default) — or, the very first
        time, against the built-in default below.
     2. If it matches, signs into ONE fixed, hidden Firebase Auth
        account (ADMIN_INTERNAL_EMAIL) that exists only to satisfy
        the Firestore rules' isAdmin() check. You never see or type
        its password — it's just plumbing.
   Change your username/password any time from Admin Panel 
   Account Settings (bottom of the sidebar).

   Caveat to know about: because there's no server here, the stored
   password hash has to be readable by the browser before login
   succeeds, which means it's technically fetchable by anyone who
   inspects network traffic — a determined attacker could attempt to
   crack a weak password offline. Use a password you don't reuse
   elsewhere, and see README.md for how to close this gap properly
   with a Cloud Function if this ever handles real customer data. */

// Fixed hidden Firebase Auth account used only so Firestore's
// isAdmin() rule (which needs request.auth) has something to check.
// Set this up once — see README.md "Admin login setup" — then never
// touch it again. It is NOT the username/password you log in with.
const ADMIN_INTERNAL_EMAIL = "internal-admin@freshcart-c68d3.firebaseapp.com";
const ADMIN_INTERNAL_PASSWORD = "BM8GyzLvDdxuf6lqnMS8NmHB3rYeSdjc";

// Used only if no adminCredentials/default document exists yet
// (i.e. before you've ever changed the password in Account Settings).
const DEFAULT_ADMIN_USERNAME = "adminoffreshcart";
const DEFAULT_ADMIN_PASSWORD = "letmein";

async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function getAdminCredentials(){
  try{
    const doc = await db.collection('adminCredentials').doc('default').get();
    if(doc.exists) return doc.data();
  }catch(e){ /* fall through to default */ }
  return { username: DEFAULT_ADMIN_USERNAME, passwordHash: await sha256Hex(DEFAULT_ADMIN_PASSWORD) };
}

const CATEGORY_EMOJI = {"Vegetables":"","Fruits":"","Dairy":"","Bakery":"","Snacks":"","Beverages":"","Rice & Grains":"","Pulses":"","Spices":"","Household":"","Personal Care":"","Instant Food":""};
function catEmoji(n){ return CATEGORY_EMOJI[n] || ""; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function inr(n){ return ''+(Math.round((n||0)*100)/100).toLocaleString('en-IN'); }
const STATUS_STEPS=['PLACED','CONFIRMED','PREPARING','READY','OUT_FOR_DELIVERY','DELIVERED'];

let state = {
  loading:true, screen: fbReady ? 'login' : 'config', user:null, isAdmin:false, authError:null,
  page:'dashboard', sidebarOpen:false,
  categories:[], products:[], orders:[], payments:[], customers:[], coupons:[], paymentSettings:null, storeSettings:null,
  modal:null, editing:null, toastMsg:null,
  orderFilter:'ALL', orderSearch:'', paymentFilter:'ALL', paymentSearch:'', productSearch:'',
  activeTab:'history',
};
window.state = state;

function toast(msg){ state.toastMsg=msg; render(); setTimeout(()=>{state.toastMsg=null;render();},2400); }
function go(page){ state.page=page; state.sidebarOpen=false; render(); }
function openModal(name, editing=null){ state.modal=name; state.editing=editing; render(); }
function closeModal(){ state.modal=null; state.editing=null; render(); }

/* ---------------- Auth ---------------- */
function initAuth(){
  if(!fbReady){ state.loading=false; render(); return; }
  auth.onAuthStateChanged(async (u)=>{
    state.user=u;
    if(u){
      try{
        const doc = await db.collection('users').doc(u.uid).get();
        state.isAdmin = doc.exists && doc.data().role==='admin';
      }catch(e){ state.isAdmin=false; }
      if(!state.isAdmin){
        state.authError = 'This account does not have admin access. See README.md "Admin login setup".';
        await auth.signOut();
        state.user=null; state.screen='login';
      } else {
        state.screen='app';
        await loadAll();
      }
    } else {
      state.screen='login';
    }
    state.loading=false;
    render();
  });
}
async function handleAdminLogin(e){
  e.preventDefault();
  const f=e.target, username=f.username.value.trim(), pass=f.password.value;
  const btn=f.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='Signing in…';
  state.authError = null;
  try{
    const creds = await getAdminCredentials();
    const hash = await sha256Hex(pass);
    if(username !== creds.username || hash !== creds.passwordHash){
      state.authError = 'Incorrect username or password.';
      render();
      return;
    }
    await auth.signInWithEmailAndPassword(ADMIN_INTERNAL_EMAIL, ADMIN_INTERNAL_PASSWORD);
  }catch(err){
    state.authError = (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential')
      ? 'Admin login isn\'t set up yet in Firebase — see README.md "Admin login setup".'
      : err.message;
    render();
  }
}
function handleAdminLogout(){ auth.signOut(); go('dashboard'); }
async function refreshData(){
  const btn = document.getElementById('refreshBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Refreshing…'; }
  await loadAll();
  if(btn){ btn.disabled = false; btn.textContent = ' Refresh Data'; }
  toast('Data refreshed');
  render();
}
window.refreshData = refreshData;

async function saveAdminCredentials(e){
  e.preventDefault();
  const f = e.target;
  const currentPass = f.currentPassword.value;
  const newUsername = f.newUsername.value.trim();
  const newPassword = f.newPassword.value;
  const confirmPassword = f.confirmPassword.value;
  if(newPassword !== confirmPassword){ toast("New passwords don't match"); return; }
  if(newPassword.length < 6){ toast('New password should be at least 6 characters'); return; }
  try{
    const creds = await getAdminCredentials();
    const currentHash = await sha256Hex(currentPass);
    if(currentHash !== creds.passwordHash){ toast('Current password is incorrect'); return; }
    const newHash = await sha256Hex(newPassword);
    await db.collection('adminCredentials').doc('default').set({ username:newUsername, passwordHash:newHash });
    toast('Login details updated');
    f.reset();
  }catch(err){ toast(err.message); }
}
window.saveAdminCredentials = saveAdminCredentials;

/* ---------------- Data loading ---------------- */
async function loadAll(){
  try{
    const [cats, prods, ords, pays, users, cpns, psets, ssets] = await Promise.all([
      db.collection('categories').get(),
      db.collection('products').get(),
      db.collection('orders').orderBy('createdAt','desc').get(),
      db.collection('payments').orderBy('createdAt','desc').get(),
      db.collection('users').where('role','==','customer').get(),
      db.collection('coupons').get(),
      db.collection('paymentSettings').doc('default').get(),
      db.collection('storeSettings').doc('default').get(),
    ]);
    state.categories = cats.docs.map(d=>({id:d.id,...d.data()}));
    state.products = prods.docs.map(d=>({id:d.id,...d.data()}));
    state.orders = ords.docs.map(d=>({id:d.id,...d.data()}));
    state.payments = pays.docs.map(d=>({id:d.id,...d.data()}));
    state.customers = users.docs.map(d=>({id:d.id,...d.data()}));
    state.coupons = cpns.docs.map(d=>({id:d.id,...d.data()}));
    state.paymentSettings = psets.exists ? psets.data() : {merchantName:'',upiId:'',qrCodeUrl:'',onlinePaymentEnabled:false,codEnabled:true};
    state.storeSettings = ssets.exists ? ssets.data() : {storeName:'FreshCart',logoUrl:'',bannerUrl:''};
  }catch(e){ toast('Load error: '+e.message); }
}

/* ---------------- Derived stats ---------------- */
function isToday(ts){ if(!ts?.toDate) return false; const d=ts.toDate(), t=new Date(); return d.toDateString()===t.toDateString(); }
function statsBundle(){
  const todays = state.orders.filter(o=>isToday(o.createdAt));
  const totalSales = state.orders.reduce((s,o)=>s+(o.total||0),0);
  const todaySales = todays.reduce((s,o)=>s+(o.total||0),0);
  const pending = state.orders.filter(o=>!['DELIVERED','CANCELLED'].includes(o.orderStatus)).length;
  const completed = state.orders.filter(o=>o.orderStatus==='DELIVERED').length;
  const onlineAmt = state.orders.filter(o=>o.paymentMethod==='ONLINE' && o.paymentStatus==='PAID').reduce((s,o)=>s+o.total,0);
  const codAmt = state.orders.filter(o=>o.paymentMethod==='COD' && o.orderStatus==='DELIVERED').reduce((s,o)=>s+o.total,0);
  const lowStock = state.products.filter(p=>p.stock>0 && p.stock<10).length;
  const outStock = state.products.filter(p=>(p.stock||0)<=0).length;
  return {totalSales, todaySales, totalOrders:state.orders.length, pending, completed, onlineAmt, codAmt, customers:state.customers.length, lowStock, outStock};
}

/* ---------------- Image upload  compressed base64 ---------------- */
function fileToCompressedDataURL(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not read image'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function handleImageFile(event, hiddenId, previewId, maxDim){
  const file = event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Please choose an image file'); return; }
  if(file.size > 10*1024*1024){ toast('Image too large — please choose one under 10MB'); return; }
  const preview = document.getElementById(previewId);
  if(preview) preview.innerHTML = `<div class="skeleton" style="width:100%;height:100%;"></div>`;
  try{
    const dataUrl = await fileToCompressedDataURL(file, maxDim || 500, 0.72);
    const hidden = document.getElementById(hiddenId);
    if(hidden) hidden.value = dataUrl;
    if(preview) preview.innerHTML = `<img src="${dataUrl}">`;
  }catch(err){
    toast(err.message || 'Could not process image');
    if(preview) preview.innerHTML = 'No image';
  }
}
window.handleImageFile = handleImageFile;

/* ---------------- Render root ---------------- */
function render(){
  const app = document.getElementById('app');
  if(!fbReady){ app.innerHTML = renderConfigNeeded(); return; }
  if(state.loading){ app.innerHTML = `<div class="login-wrap"><div style="color:#fff;">Loading…</div></div>`; return; }
  if(state.screen==='login'){ app.innerHTML = renderLogin(); return; }
  let body='';
  switch(state.page){
    case 'dashboard': body=renderDashboard(); break;
    case 'products': body=renderProducts(); break;
    case 'categories': body=renderCategories(); break;
    case 'inventory': body=renderInventory(); break;
    case 'orders': body=renderOrders(); break;
    case 'payments': body=renderPayments(); break;
    case 'customers': body=renderCustomers(); break;
    case 'offers': body=renderOffers(); break;
    case 'store': body=renderStoreSettings(); break;
    case 'account': body=renderAccountSettings(); break;
    case 'demo': body=renderDemoData(); break;
    default: body=renderDashboard();
  }
  app.innerHTML = renderShell(body) + renderModal();
  attachAfterRender();
}

function renderConfigNeeded(){
  return `<div class="login-wrap"><div class="login-card"><div class="ic"></div>
    <h2>Connect Firebase</h2>

function statCard(lbl,val,warn=false){ return `<div class="stat ${warn?'warn':''}"><div class="lbl">${lbl}</div><div class="val">${val}</div></div>`; }

function drawCharts(){
  if(state.page!=='dashboard' || typeof Chart==='undefined') return;
  const days=[]; const map={};
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const key=d.toLocaleDateString('en-IN',{weekday:'short'}); days.push(key); map[d.toDateString()]=0; }
  state.orders.forEach(o=>{ if(o.createdAt?.toDate){ const key=o.createdAt.toDate().toDateString(); if(key in map) map[key]+=o.total||0; } });
  const salesData = Object.values(map);
  const c1 = document.getElementById('salesChart');
  if(c1){ new Chart(c1, {type:'line', data:{labels:days, datasets:[{label:'Sales ()', data:salesData, borderColor:'#1f6b45', backgroundColor:'rgba(31,107,69,.12)', fill:true, tension:.35}]}, options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}}); }
  const c2 = document.getElementById('statusChart');
  if(c2){
    const counts = STATUS_STEPS.concat('CANCELLED').map(s=>state.orders.filter(o=>o.orderStatus===s).length);
    new Chart(c2, {type:'doughnut', data:{labels:STATUS_STEPS.concat('CANCELLED').map(s=>s.replace('_',' ')), datasets:[{data:counts, backgroundColor:['#f4c667','#7db8f0','#f2ab6f','#b39bf0','#7fd0f0','#7fd6a0','#e88a8a']}]}, options:{plugins:{legend:{position:'bottom', labels:{font:{size:10}}}}}});
  }
}

async function saveProduct(e){
  e.preventDefault();
  const f=e.target;
  const data = {
    name:f.name.value.trim(), description:f.description.value.trim(), category:f.category.value,
    categoryId: state.categories.find(c=>c.name===f.category.value)?.id || '',
    price:parseFloat(f.price.value)||0, discount:parseFloat(f.discount.value)||0,
    unit:f.unit.value.trim(), stock:parseInt(f.stock.value)||0, active:f.active.checked,
    featured:f.featured.checked, imageUrl:f.imageUrl.value.trim(),
  };
  try{
    if(state.editing?.id){
      await db.collection('products').doc(state.editing.id).update(data);
      toast('Product updated');
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp(); data.soldCount=0;
      await db.collection('products').add(data);
      toast('Product added');
    }
    closeModal(); await loadAll(); render();
  }catch(err){ toast(err.message); }
}

}

      <td style="cursor:pointer;" onclick='openModal("orderDetail", ${JSON.stringify(o).replace(/'/g,"&apos;")})'><b style="color:var(--green-700);">#${o.id.slice(0,8)}</b><div style="color:var(--muted);font-size:11px;">${date}</div></td>

      <td><button class="btn btn-outline btn-sm" onclick='openModal("orderDetail", ${JSON.stringify(o).replace(/'/g,"&apos;")})'>${o.items.length} item${o.items.length>1?'s':''} — View</button></td>
      <td>${inr(o.total)}</td>
      <td><span class="chip ${o.paymentStatus}">${o.paymentStatus}</span><div style="font-size:10px;color:var(--muted);margin-top:2px;">${o.paymentMethod}</div></td>
      <td><span class="chip ${o.orderStatus}">${o.orderStatus.replace('_',' ')}</span></td>
      ${compact?'':`<td>
        <div style="display:flex;gap:6px;align-items:center;">
          <select onchange="updateOrderStatus('${o.id}', this.value)">
            ${STATUS_STEPS.concat('CANCELLED').map(s=>`<option value="${s}" ${o.orderStatus===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}
          </select>
          <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteOrder('${o.id}')">Delete</button>
        </div>
      </td>`}
    </tr>`;
  }).join('')}</tbody></table>`;
}
async function updateOrderStatus(orderId, newStatus){
  try{
    await db.collection('orders').doc(orderId).update({ orderStatus:newStatus });
    toast('Order status updated');
    await loadAll(); render();
  }catch(e){ toast(e.message); }
}
async function deleteOrder(orderId){
  if(!confirm('Delete this order permanently? This cannot be undone. (The customer\'s stock is not restored automatically.)')) return;
  try{
    await db.collection('orders').doc(orderId).delete();
    const paySnap = await db.collection('payments').where('orderId','==',orderId).get();
    const batch = db.batch();
    paySnap.docs.forEach(d => batch.delete(d.ref));
    if(!paySnap.empty) await batch.commit();
    toast('Order deleted');
    closeModal();
    await loadAll(); render();
  }catch(e){ toast('Could not delete order: ' + e.message); }
}
window.deleteOrder = deleteOrder;

async function loadDemoData(){
  if(state.products.length > 0 || state.categories.length > 0){
    if(!confirm('You already have products or categories. Load demo data anyway? (This adds new items, it will not remove or replace what you already have.)')) return;
  }
  const btn = document.getElementById('seedBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Loading…'; }
  try{
    const batch = db.batch();
    const catIds = {};
    DEMO_CATEGORIES.forEach(name=>{
      const ref = db.collection('categories').doc();
      catIds[name] = ref.id;
      batch.set(ref, { name, image:'', active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
    DEMO_PRODUCTS.forEach(([name, category, unit, price, discount])=>{
      const ref = db.collection('products').doc();
      batch.set(ref, {
        name, category, categoryId: catIds[category], unit, price, discount,
        description: `Fresh, quality-checked ${name.toLowerCase()}, sourced daily for FreshCart customers.`,
        stock: Math.floor(Math.random()*40) + 5,
        active: true, featured: Math.random() < 0.25, soldCount: Math.floor(Math.random()*100),
        imageUrl: '', createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    });
    DEMO_COUPONS.forEach(c=>{ batch.set(db.collection('coupons').doc(), c); });
    await batch.commit();
    toast(`Loaded ${DEMO_CATEGORIES.length} categories, ${DEMO_PRODUCTS.length} products, ${DEMO_COUPONS.length} coupons`);
    await loadAll();
    render();
  }catch(err){
    toast('Could not load demo data: ' + err.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Load Demo Data'; }
  }
}
window.loadDemoData = loadDemoData;

/* ---------------- Customers ---------------- */
function renderCustomers(){

    return {...c, orderCount:custOrders.length, spent:custOrders.reduce((s,o)=>s+(o.total||0),0)};
  });
  return `
  <div class="pagehead"><div><h1>Customers</h1><p>${state.customers.length} registered</p></div></div>
  <table class="datatable"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Orders</th><th>Total Spent</th></tr></thead>

    <td>${esc(c.name)}</td><td>${esc(c.phone||'—')}</td><td>${esc(c.email)}</td><td>${c.orderCount}</td><td>${inr(c.spent)}</td>
  </tr>`).join('') || `<tr><td colspan="5"><div class="empty"><div class="ic"></div><h3>No customers yet</h3></div></td></tr>`}

async function saveCoupon(e){
  e.preventDefault(); const f=e.target;
  const data = {
    code:f.code.value.trim().toUpperCase(), type:f.type.value, value:parseFloat(f.value.value)||0,
    minimumOrder:parseFloat(f.minimumOrder.value)||0, startDate:f.startDate.value, endDate:f.endDate.value, active:f.active.checked,
  };
  try{
    if(state.editing?.id){ await db.collection('coupons').doc(state.editing.id).update(data); toast('Coupon updated'); }
    else { await db.collection('coupons').add(data); toast('Coupon created'); }
    closeModal(); await loadAll(); render();
  }catch(err){ toast(err.message); }
}
async function deleteCoupon(id){
  if(!confirm('Delete this coupon?')) return;
  try{ await db.collection('coupons').doc(id).delete(); toast('Coupon deleted'); await loadAll(); render(); }
  catch(e){ toast(e.message); }
}

  if(state.modal==='orderDetail') return orderDetailModal();
